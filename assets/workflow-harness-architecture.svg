<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1330" viewBox="0 0 1500 1330">
  <rect width="1500" height="1330" fill="#111"/>
  <style>
    .title{font:700 31px ui-monospace,monospace;fill:#ddd}.label{font:19px ui-monospace,monospace;fill:#ddd}.small{font:16px ui-monospace,monospace;fill:#ddd}.box{fill:none;stroke:#ddd;stroke-width:2.5;rx:12}.line{stroke:#ddd;stroke-width:2.5;fill:none}.state{fill:none;stroke:#d67a00;stroke-width:2.5;rx:12}.orange{fill:#e18a00}.blue{fill:#4aa3df}.green{fill:#3ebd58}.pink{fill:#ff7474}.section{stroke:#ddd;stroke-width:2.5}.core{fill:none;stroke:#ff7474;stroke-width:2.5;rx:12}
  </style>
  <text x="750" y="52" text-anchor="middle" class="title">Workflow Harness Architecture</text>
  <line x1="20" y1="82" x2="1480" y2="82" class="section"/>
  <text x="30" y="108" class="label">Configuration Layer</text>

  <g transform="translate(150 145)">
    <rect width="190" height="54" class="box"/><text x="95" y="34" text-anchor="middle" class="small">Model Configs</text>
  </g>
  <g transform="translate(355 145)">
    <rect width="190" height="54" class="box"/><text x="95" y="24" text-anchor="middle" class="small">Model Provider</text><text x="95" y="43" text-anchor="middle" class="small">Configs</text>
  </g>
  <g transform="translate(560 145)">
    <rect width="180" height="54" class="box"/><text x="90" y="34" text-anchor="middle" class="small">Graph Configs</text>
  </g>
  <g transform="translate(755 145)">
    <rect width="180" height="54" class="box"/><text x="90" y="34" text-anchor="middle" class="small">Tool Configs</text>
  </g>
  <g transform="translate(950 145)">
    <rect width="180" height="54" class="box"/><text x="90" y="24" text-anchor="middle" class="small">Runtime</text><text x="90" y="43" text-anchor="middle" class="small">Configs</text>
  </g>

  <line x1="20" y1="238" x2="1480" y2="238" class="section"/>
  <text x="30" y="266" class="label">Workflow Layer</text>

  <text x="485" y="307" class="small">Coordinates subgraphs and manages</text>
  <text x="485" y="329" class="small">workflow state. Does not directly</text>
  <text x="485" y="351" class="small">perform domain-level external mutations</text>
  <text x="540" y="377" class="small green">decides WHAT happens</text>
  <g transform="translate(590 388)"><rect width="165" height="58" class="box"/><text x="82.5" y="25" text-anchor="middle" class="small">Orchestrator</text><text x="82.5" y="46" text-anchor="middle" class="small">Graph</text></g>

  <path d="M590 430 L410 535" class="line"/><text x="455" y="492" class="small">contract</text>
  <path d="M755 430 L930 535" class="line"/><text x="820" y="492" class="small">contract</text>

  <g transform="translate(815 310)"><rect width="250" height="60" class="state"/><text x="125" y="25" text-anchor="middle" class="small orange">Graph State,</text><text x="125" y="47" text-anchor="middle" class="small orange">Artifact References</text></g>
  <path d="M755 414 L815 355" stroke="#d67a00" stroke-width="2.5" fill="none"/><text x="770" y="390" class="small orange">Manages</text>
  <text x="1080" y="328" class="small blue">Artifacts are durable files or data that</text><text x="1080" y="350" class="small blue">live outside graph state; state tracks</text><text x="1080" y="372" class="small blue">them by reference.</text>

  <text x="120" y="540" class="small">Accomplishes a bounded unit of work. Has an</text><text x="120" y="562" class="small">explicit input/output contract. May mutate</text><text x="120" y="584" class="small">external systems through tools.</text><text x="260" y="609" class="small green">causes things to happen</text>
  <g transform="translate(250 620)"><rect width="170" height="58" class="box"/><text x="85" y="35" text-anchor="middle" class="small">Task Graph</text></g>
  <g transform="translate(40 705)"><rect width="235" height="62" class="state"/><text x="117" y="26" text-anchor="middle" class="small orange">Sub-Graph State,</text><text x="117" y="49" text-anchor="middle" class="small orange">Artifact References</text></g>
  <path d="M250 655 L220 705" stroke="#d67a00" stroke-width="2.5" fill="none"/><text x="165" y="694" class="small orange">Manages</text>

  <text x="690" y="540" class="small">Acquires, transforms, and returns information required</text><text x="690" y="562" class="small">by the requestor. Has an explicit output contract. May</text><text x="690" y="584" class="small">only use pure and read capabilities. No mutations.</text><text x="755" y="609" class="small green">determines/returns information</text>
  <g transform="translate(810 620)"><rect width="180" height="58" class="box"/><text x="90" y="35" text-anchor="middle" class="small">Context Graph</text></g>
  <g transform="translate(1070 705)"><rect width="240" height="62" class="state"/><text x="120" y="26" text-anchor="middle" class="small orange">Sub-Graph State,</text><text x="120" y="49" text-anchor="middle" class="small orange">Artifact References</text></g>
  <path d="M990 655 L1070 705" stroke="#d67a00" stroke-width="2.5" fill="none"/><text x="1000" y="694" class="small orange">Manages</text>

  <text x="1000" y="470" class="small blue">Sub-graph usage is governed</text><text x="1000" y="492" class="small blue">by input/output contracts</text>

  <path d="M420 670 L585 800" class="line"/><text x="490" y="742" class="small">contract</text>
  <path d="M810 670 L690 800" class="line"/><text x="715" y="742" class="small">contract</text>
  <text x="495" y="795" class="small">Used by Task and Context Graphs to provide external</text><text x="495" y="817" class="small">or specialized capabilities to nodes</text>
  <g transform="translate(615 835)"><rect width="165" height="58" class="box"/><text x="82" y="35" text-anchor="middle" class="small">Tools</text></g>
  <text x="900" y="844" class="small blue">Tools are labeled with ToolEffect type</text><text x="900" y="866" class="small blue">(pure, read, write, external-communication,</text><text x="900" y="888" class="small blue">destructive, etc.)</text>

  <path d="M335 678 C330 820 390 920 545 980" stroke="#ff7474" stroke-width="2.5" fill="none"/><text x="335" y="843" class="small pink">Uses</text>
  <path d="M900 678 C900 820 835 920 750 980" stroke="#ff7474" stroke-width="2.5" fill="none"/><text x="870" y="843" class="small pink">Uses</text>
  <path d="M698 893 L698 975" stroke="#ff7474" stroke-width="2.5" fill="none"/><text x="710" y="941" class="small pink">Uses</text>
  <text x="360" y="990" class="small">Pure, deterministic functions. Parsers, validators, formatters,</text><text x="360" y="1012" class="small">calculators, transformations, and algorithms. No external side effects.</text>
  <g transform="translate(620 1030)"><rect width="170" height="58" class="core"/><text x="85" y="35" text-anchor="middle" class="small pink">Functional Core</text></g>

  <line x1="20" y1="1120" x2="1480" y2="1120" class="section"/><text x="30" y="1150" class="label">Runtime Layer</text>
  <g transform="translate(120 1178)"><rect width="170" height="54" class="box"/><text x="85" y="34" text-anchor="middle" class="small">Custom</text></g>
  <g transform="translate(305 1178)"><rect width="170" height="54" class="box"/><text x="85" y="34" text-anchor="middle" class="small">LangGraph</text></g>
  <g transform="translate(490 1178)"><rect width="170" height="54" class="box"/><text x="85" y="34" text-anchor="middle" class="small">Mastra</text></g>
  <g transform="translate(675 1178)"><rect width="170" height="54" class="box"/><text x="85" y="34" text-anchor="middle" class="small">...</text></g>

  <line x1="20" y1="1250" x2="1480" y2="1250" class="section"/><text x="30" y="1280" class="label">Observation Layer</text>
  <g transform="translate(120 1290)"><rect width="170" height="34" class="box"/><text x="85" y="24" text-anchor="middle" class="small">Custom Logs</text></g>
  <g transform="translate(305 1290)"><rect width="185" height="34" class="box"/><text x="92" y="24" text-anchor="middle" class="small">Langfuse / LangSmith</text></g>
  <g transform="translate(505 1290)"><rect width="150" height="34" class="box"/><text x="75" y="24" text-anchor="middle" class="small">...</text></g>
</svg>
